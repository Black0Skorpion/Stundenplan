plugins {
    id 'com.android.application'
}

android {
    namespace 'de.stundenplan.widget'
    compileSdk 36

    defaultConfig {
        applicationId 'de.stundenplan.widget'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.6.1'
    }

    // Fester Signaturschlüssel, damit Updates über die vorhandene App installiert werden können.
    // Der Schlüssel liegt NICHT im Repo: der Workflow legt ihn aus den GitHub-Secrets
    // ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORT an und übergibt Pfad und Passwort hier.
    signingConfigs {
        release {
            def datei = System.getenv("KEYSTORE_DATEI")
            if (datei) {
                storeFile file(datei)
                storePassword System.getenv("KEYSTORE_PASSWORT")
                keyAlias "stundenplan"
                keyPassword System.getenv("KEYSTORE_PASSWORT")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_DATEI")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // QR-Code erzeugen (reines Java)
    implementation 'com.google.zxing:core:3.5.3'
    // QR-Code scannen über Google Play-Dienste (ohne Kamera-Berechtigung)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
