name: APK bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "ios-app/**"
      - "ios/**"
      - ".github/workflows/ios.yml"
      - ".github/workflows/archiv.yml"
      - ".github/workflows/aufraeumen.yml"
      - ".github/workflows/daten.yml"
      - ".github/workflows/vbbtest.yml"
      - "README.md"
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Stundenplan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-APK
          path: Stundenplan.apk
      - name: Als Release mit Versionsnummer veröffentlichen (alte Versionen bleiben erhalten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          TAG="android-v$VERSION"
          cp Stundenplan.apk "Stundenplan-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Gleiche Version neu gebaut: nur die Datei ersetzen
            gh release upload "$TAG" "Stundenplan-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "Stundenplan-$VERSION.apk" \
              --title "Android-App $VERSION" \
              --notes "Stundenplan-App für Android, Version $VERSION. Auf dem Handy Stundenplan-$VERSION.apk antippen und installieren. Gebaut aus ${GITHUB_SHA::7}." \
              --latest
          fi

      - name: Datei in releases/android/ ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "Stundenplan-$VERSION.apk" "$RUNNER_TEMP/"
          NAME=$(basename "Stundenplan-$VERSION.apk")
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p releases/android
            cp "$RUNNER_TEMP/$NAME" releases/android/
            git add releases/android
            git diff --cached --quiet && break
            git commit -q -m "Android-App $VERSION in releases/android abgelegt"
            git push -q origin HEAD:main && break
            sleep 5
          done
