name: APK bauen

on:
  push:
    paths-ignore:
      - "ios-app/**"
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Stundenplan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-APK
          path: Stundenplan.apk
      - name: Als Release "aktuell" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell Stundenplan.apk \
            --title "Stundenplan-App (aktuell)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Auf dem Android-Handy Stundenplan.apk antippen und installieren." \
            --target "$GITHUB_SHA"
