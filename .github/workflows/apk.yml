name: APK bauen

on:
  push:
    branches: [main]
    # Nur bauen, wenn sich wirklich etwas an der Android-App ändert
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signaturschlüssel aus den Secrets anlegen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORT }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORT fehlen (Settings → Secrets and variables → Actions). Ohne festen Schlüssel wird nichts veröffentlicht."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_DATEI=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PW"
          echo "KEYSTORE_PASSWORT=$KEYSTORE_PW" >> "$GITHUB_ENV"
      - name: APK bauen (signiert mit festem Schlüssel)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Stundenplan.apk
          # Prüfen, dass wirklich der feste Schlüssel verwendet wurde
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs Stundenplan.apk | grep -E "Signer #1 certificate (DN|SHA-256)" | sed 's/^/::notice::/'
      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-APK
          path: Stundenplan.apk
      - name: Als Release mit Versionsnummer veröffentlichen (alte Versionen bleiben erhalten)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          TAG="android-v$VERSION"
          cp Stundenplan.apk "Stundenplan-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Gleiche Version neu gebaut: nur die Datei ersetzen
            gh release upload "$TAG" "Stundenplan-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "Stundenplan-$VERSION.apk" \
              --title "Android-App $VERSION" \
              --notes "Stundenplan-App für Android, Version $VERSION. Auf dem Handy Stundenplan-$VERSION.apk antippen und installieren. Signiert mit festem Schlüssel (ab 1.4) – Updates lassen sich direkt drüber installieren. Gebaut aus ${GITHUB_SHA::7}." \
              --latest
          fi

      - name: Datei in releases/android/ ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "Stundenplan-$VERSION.apk" "$RUNNER_TEMP/"
          NAME=$(basename "Stundenplan-$VERSION.apk")
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p releases/android
            cp "$RUNNER_TEMP/$NAME" releases/android/
            git add releases/android
            git diff --cached --quiet && break
            git commit -q -m "Android-App $VERSION in releases/android abgelegt"
            git push -q origin HEAD:main && break
            sleep 5
          done
