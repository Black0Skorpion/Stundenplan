name: Daten sammeln
# Hilfs-Workflow: lädt öffentliche Daten (Haltestellen, Mensen, Lagepläne) und legt sie im Zweig "daten" ab.
on:
  push:
    branches: [main]
    paths: [".github/workflows/daten.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out && cd out
          h() { curl -sL --max-time 120 -A "Mozilla/5.0" -o "$1" "$2"; echo "::warning::$1 $(stat -c %s "$1" 2>/dev/null) $(file -b "$1" | head -c 60)"; }
          for srv in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            OQ='[out:json][timeout:90];(nwr["building"](around:900,52.4005,13.0140);nwr["building"](around:800,52.3935,13.1290););out tags center;'
            curl -s --max-time 120 -A "Stundenplan-Datensammlung (github.com/Black0Skorpion/Stundenplan)" -H "Accept: application/json" --data-urlencode "data=$OQ" "$srv" -o osm.json
            echo "::warning::osm $srv $(stat -c %s osm.json) $(head -c 80 osm.json)"
            head -c 20 osm.json | grep -q '{' && break
          done
          ls -la
      - run: |
          cd out
          git init -q -b daten && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm daten
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" daten
