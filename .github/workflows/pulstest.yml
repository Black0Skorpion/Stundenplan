name: PULS-Test (Swift)
on:
  push:
    branches: [main]
    paths: ["ios-app/App/Puls.swift", "ios-app/Tests/**", ".github/workflows/pulstest.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          swiftc -parse-as-library ios-app/App/Puls.swift ios-app/Tests/PulsTest.swift -o pulstest 2> fehler.txt || { sed 's/^/::error::/' fehler.txt | head -20; exit 1; }
          code=0; ./pulstest > ergebnis.txt 2>&1 || code=$?
          mkdir aus && cp ergebnis.txt aus/
          cd aus && git init -q -b daten && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm test && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daten
          exit $code
