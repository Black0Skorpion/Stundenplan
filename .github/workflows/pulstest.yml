name: PULS-Analyse
on:
  push:
    branches: [main]
    paths: [".github/workflows/pulstest.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q beautifulsoup4 lxml
          mkdir aus && cd aus
          python3 - <<'PY'
          import urllib.request, re, time, html
          from bs4 import BeautifulSoup
          UA = {"User-Agent": "Stundenplan-Test (github.com/Black0Skorpion/Stundenplan)"}
          def hol(u, name):
              t = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode('utf-8', 'ignore')
              open(name, 'w').write(t); time.sleep(1.5); return t
          u = "https://puls.uni-potsdam.de/qisserver/rds?state=wtree&search=1&trex=step&root120262=277989%7C279834&P.vx=kurz"
          pfad = ["Informatik", "Bachelor", "Informatik", "Pflicht", "Grundlagen", ""]
          for ebene in range(7):
              t = hol(u, f"ebene{ebene}.html")
              s = BeautifulSoup(t, 'lxml')
              links = [(a.get_text(' ', strip=True), a['href']) for a in s.find_all('a', href=True) if 'state=wtree' in a['href'] and 'trex=step' in a['href'] and 'P.vx=kurz' in a['href']]
              vs = [a for a in s.find_all('a', href=True) if 'publishid=' in a['href']]
              print(ebene, len(links), 'Ordner', len(vs), 'Veranstaltungen', [l[0] for l in links][:15])
              if vs and not links: break
              ziel = pfad[ebene] if ebene < len(pfad) else ""
              wahl = next((l for l in links if ziel and ziel.lower() in l[0].lower()), None) or (links[1] if len(links) > 1 else None)
              if not wahl: break
              print('  ->', wahl[0]); u = html.unescape(wahl[1])
          # Suche: verschiedene Varianten probieren
          for i, q in enumerate(["state=wsearv&search=1&subdir=veranstaltung&veranstaltung.dtxt=Maschinenmodelle&veranstaltung.semester=20262&_form=display",
                                 "state=wsearv&search=2&subdir=veranstaltung&veranstaltung.dtxt=Maschinenmodelle",
                                 "state=wsearch&search=1&subdir=veranstaltung&veranstaltung.dtxt=Maschinenmodelle&P_start=0&P_anzahl=20&_form=display"]):
              try:
                  t = hol("https://puls.uni-potsdam.de/qisserver/rds?" + q, f"suche{i}.html")
                  print('suche', i, 'publishids:', len(re.findall('publishid=', t)), 'fehler' if 'Fehler aufgetreten' in t else '')
              except Exception as e: print('suche', i, e)
          PY
          git init -q -b daten && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm puls
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daten
