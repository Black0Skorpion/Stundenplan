name: iOS-App bauen

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Version lesen
        run: echo "VERSION=$(tr -d '[:space:]' < ios-app/VERSION)" >> "$GITHUB_ENV"

      - name: Projekt erzeugen (XcodeGen)
        working-directory: ios-app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App bauen (unsigniert)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild \
            -project Stundenplan.xcodeproj \
            -target Stundenplan \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build > build.log 2>&1 || (grep -E "error:" -A3 build.log | head -150; tail -40 build.log; exit 1)
          grep -c "warning:" build.log || true

      - name: IPA packen (App-Gruppe als Berechtigung eintragen)
        working-directory: ios-app
        run: |
          APP=build/Release-iphoneos/Stundenplan.app
          ls -la "$APP" "$APP/PlugIns"
          # Ad-hoc-Signatur nur, damit die Berechtigungen (App-Gruppe) in der Datei stehen.
          # SideStore/iloader signieren beim Installieren ohnehin neu.
          codesign -f -s - --entitlements Support/Widgets.entitlements "$APP/PlugIns/StundenplanWidgets.appex"
          codesign -f -s - --entitlements Support/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "../Stundenplan-$VERSION.ipa" Payload
          ls -la ../Stundenplan-*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Stundenplan-IPA
          path: Stundenplan-*.ipa

      - name: Als Release mit Versionsnummer veröffentlichen (alte Versionen bleiben erhalten)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Gleiche Version neu gebaut: nur die Datei ersetzen
            gh release upload "$TAG" "Stundenplan-$VERSION.ipa" --clobber
          else
            gh release create "$TAG" "Stundenplan-$VERSION.ipa" \
              --title "iOS-App $VERSION" \
              --notes "Stundenplan-App für iPhone/iPad mit Widgets, Version $VERSION (Build $GITHUB_RUN_NUMBER). Installation: Stundenplan-$VERSION.ipa mit iloader (PC) oder SideStore installieren. Gebaut aus ${GITHUB_SHA::7}." \
              --latest=false
          fi

      - name: Datei in releases/ios/ ablegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "Stundenplan-$VERSION.ipa" "$RUNNER_TEMP/"
          NAME=$(basename "Stundenplan-$VERSION.ipa")
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p releases/ios
            cp "$RUNNER_TEMP/$NAME" releases/ios/
            git add releases/ios
            git diff --cached --quiet && break
            git commit -q -m "iOS-App $VERSION in releases/ios abgelegt"
            git push -q origin HEAD:main && break
            sleep 5
          done
