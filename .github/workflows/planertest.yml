name: Planer-Analyse
on:
  push:
    branches: [main]
    paths: [".github/workflows/planertest.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir p && cd p
          B=https://planner.joshuan.dev
          curl -sL -A "Mozilla/5.0" $B/de -o index.html
          for js in $(grep -oE '(src|href)="/assets/[^"]+\.js"' index.html | sed 's/^[a-z]*="//;s/"$//' | sort -u); do
            curl -sL "$B$js" >> alles.js; echo >> alles.js
          done
          for c in $(grep -oE '"(\./|/assets/)[A-Za-z0-9_.-]+\.js"' alles.js | tr -d '"' | sed 's|^\./|/assets/|' | sort -u | head -150); do
            curl -sL "$B$c" >> alles.js; echo >> alles.js
          done
          {
            echo "== Größen"; wc -c index.html alles.js
            echo "== URLs"; grep -ohE 'https?://[a-zA-Z0-9./_?=&%:-]+' alles.js index.html | grep -v -E 'w3.org|react|mozilla|schema.org|tanstack' | sort | uniq -c | sort -rn | head -60
            echo "== Kontext puls/his/qis"; grep -ohiE '.{80}(puls\.uni|qisserver|hisinone|his-in-one|/qisserver|rest/|graphql).{80}' alles.js index.html | head -40
            echo "== api-Pfade"; grep -ohE '"/(api|_server|_serverFn)[^"]{0,80}"' alles.js index.html | sort -u | head -40
            echo "== index-Anfang"; head -c 3000 index.html
            echo; echo "== index Datenblöcke"; grep -oE '.{0,100}(semester|lehrveranstaltung|course)[^<]{0,200}' index.html | head -10
          } > ../bericht.txt 2>&1
          cd ..
          for p in /api /robots.txt /sitemap.xml /impressum /de/impressum /about; do echo "$p $(curl -s -o /dev/null -w '%{http_code} %{content_type}' $B$p)" >> bericht.txt; done
          mkdir aus && mv bericht.txt aus/ && head -c 400000 p/index.html > aus/index_anfang.html
          cd aus && git init -q -b daten && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm bericht
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" daten
