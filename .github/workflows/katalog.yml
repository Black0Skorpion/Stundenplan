name: PULS-Katalog

# Baut wöchentlich den Suchkatalog (alle Veranstaltungen des Semesters) und legt ihn im
# Release „puls-katalog“ ab. Die App lädt ihn von dort (einmal, nur im WLAN) und sucht offline darin.
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths: ["werkzeuge/puls_katalog.py", ".github/workflows/katalog.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  katalog:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Katalog erstellen (aktuelles und nächstes Semester)
        run: |
          python3 werkzeuge/puls_katalog.py
          NAECHSTES=$(python3 -c "import sys;sys.path.insert(0,'werkzeuge');import puls_katalog as p;c=p.semester_code();print(c[:4]+'2' if c.endswith('1') else str(int(c[:4])+1)+'1')")
          python3 werkzeuge/puls_katalog.py "$NAECHSTES" || true
          ls -la puls-*
          for f in puls-*.json; do echo "::notice::$f: $(python3 -c "import json;print(len(json.load(open('$f'))['veranstaltungen']))") Veranstaltungen, $(stat -c %s ${f%.json}.deflate) Bytes komprimiert"; done
      - name: Im Release „puls-katalog“ ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view puls-katalog >/dev/null 2>&1; then
            gh release create puls-katalog --title "PULS-Katalog (für die Suche in der App)" \
              --notes "Wird wöchentlich automatisch erneuert: alle Veranstaltungen aus dem öffentlichen PULS-Vorlesungsverzeichnis (Titel, Nummer, Modul). Die App lädt die .deflate-Datei und sucht offline darin." \
              --prerelease --latest=false
          fi
          gh release upload puls-katalog puls-*.json puls-*.deflate --clobber
