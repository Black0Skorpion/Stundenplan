name: Release löschen

# Von Hand starten: löscht ein einzelnes Release samt Tag (z. B. veraltete „aktuell“-Releases).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag des Releases, das gelöscht werden soll"
        required: true

permissions:
  contents: write

jobs:
  loeschen:
    runs-on: ubuntu-latest
    steps:
      - name: Release löschen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
