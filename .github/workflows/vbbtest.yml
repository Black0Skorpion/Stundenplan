name: VBB-Test
on:
  push:
    branches: [main]
    paths: [".github/workflows/vbbtest.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://v6.vbb.transport.rest/journeys?from.latitude=52.40930&from.longitude=12.97700&from.address=Uni%20Golm%20Haus%209&to.latitude=52.399791&to.longitude=13.011915&to.address=Uni%20Neues%20Palais%20Haus%208&arrival=2026-10-16T12:15%2B02:00&results=2&stopovers=false&remarks=false&polylines=false&tickets=false'
          for i in 1 2 3; do curl -s --max-time 40 "$U" -o j.json -w "%{http_code}\n" && head -c 1 j.json | grep -q '{' && break; sleep 20; done
          python3 - <<'PY'
          import json
          try: d=json.load(open('j.json'))
          except Exception as e: print('::warning::kaputt', open('j.json').read()[:200]); raise SystemExit
          for j in d.get('journeys',[]):
              for l in j['legs']:
                  print('::warning::', json.dumps({k:l.get(k) for k in ['walking','distance','departure','plannedDeparture','arrival','direction','departurePlatform']}), (l.get('line') or {}).get('name'), (l.get('line') or {}).get('product'), l['origin'].get('name'), '->', l['destination'].get('name'), l['origin'].get('type'))
              print('::warning::----')
          PY
