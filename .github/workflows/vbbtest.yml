name: VBB-Test
on:
  push:
    paths: [".github/workflows/vbbtest.yml"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          t() { r=$(curl -s -o b.json -w "%{http_code} %{time_total}s" --max-time 40 -H "Accept: application/json" "$2" || echo "curl $?"); echo "::warning::$1 -> $r | $(head -c 600 b.json | tr '\n' ' ')"; }
          t vbb-loc "https://v6.vbb.transport.rest/locations?query=Golm&results=3"
          t db-loc "https://v6.db.transport.rest/locations?query=Potsdam%20Golm&results=4"
          t db-dep "https://v6.db.transport.rest/stops/8012666/departures?duration=90&results=5"
          t bahn-loc "https://int.bahn.de/web/api/reiseloesung/orte?suchbegriff=Golm%20Science%20Park&typ=ALL&limit=5"
          t bahn-loc2 "https://int.bahn.de/web/api/reiseloesung/orte?suchbegriff=Potsdam%20Golm&typ=ALL&limit=5"
